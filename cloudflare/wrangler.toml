name = "djopus"
main = "src/index.ts"
compatibility_date = "2026-03-23"
# nodejs_compat: the bundler resolves the lazily-imported /mcp handler (agents SDK)
# even though this worker never serves /mcp, so node builtins must be available.
compatibility_flags = ["nodejs_compat"]
workers_dev = false
upload_source_maps = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

[assets]
directory = "./static"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "djopus"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "drizzle"

[[durable_objects.bindings]]
name = "SESSION_BRIDGE"
class_name = "SessionBridge"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionBridge"]

[[routes]]
pattern = "djopus.moore.nyc"
custom_domain = true

[vars]
APP_NAME = "DJ Opus"
MAX_SESSIONS = "10"
